<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CHAM INFO</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1421;color:#eef5ff;font:16px system-ui,Arial}.wrap{max-width:850px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-size:24px;font-weight:800}button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;background:#253a56;color:white;font:inherit}button:hover{background:#36577f}.primary{background:#2476c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.panel{background:#18283d;border:1px solid #2b405b;border-radius:18px;padding:23px}.card{text-align:left;min-height:125px}.card b{display:block;font-size:19px;margin-bottom:9px}.muted,small{color:#aabbd0}h1{font-size:clamp(27px,5vw,40px)}h2{margin-top:30px}.back{margin-bottom:16px}.tag{color:#8ec9ff;font-size:13px;letter-spacing:.1em;text-transform:uppercase}.facts{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.fact{background:#243b57;padding:15px;border-radius:12px;min-width:140px}.fact strong{display:block;font-size:21px}p{line-height:1.65}.source{font-size:12px;color:#aabbd0;border-top:1px solid #33445a;padding-top:18px;margin-top:30px}a{color:#8ec9ff}input,textarea{width:100%;background:#0e1b2b;border:1px solid #435873;color:white;padding:14px;border-radius:12px;font:inherit}textarea{min-height:170px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:350px;margin:20px auto}.keys button{font-size:24px}#display{text-align:center;font-size:25px;letter-spacing:2px;min-height:42px}.nav{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div class="wrap"><header><div class="brand">CHAM <span style="color:#78bdf7">INFO</span></div><button onclick="home()">Startseite</button></header><main id="app"></main></div><script>
const disclaimer='Einzelne Angaben können von historischen Überlieferungen abweichen. Für korrekte und historisch belegte Informationen über die Gemeinde Cham besuchen Sie bitte <a href="https://www.chamapedia.ch" target="_blank" rel="noopener">Chamapedia</a>.';
const places=[
{title:'Hirsgarten',tag:'Parkanlage',intro:'Der Hirsgarten liegt unmittelbar am Zugersee und gehört zu den bekannten öffentlichen Uferanlagen von Cham.',facts:[['Zugersee','Lage'],['Cham','Gemeinde']],sections:[['Geschichte und Entwicklung','Der Hirsgarten wurde im Laufe der Zeit als öffentlicher Aufenthalts- und Erholungsraum genutzt. Die Geschichte des Seeufers ist eng mit der Entwicklung der Gemeinde verbunden.'],['Ufer und Wege','Grünflächen, Uferwege und die Nähe zu historischen Gebäuden prägen die Anlage.']]},
{title:'Villa Villette',tag:'Historisches Gebäude',intro:'Die Villa Villette ist ein repräsentatives historisches Gebäude am Chamer Seeufer.',facts:[['19. Jahrhundert','Historischer Kontext'],['Zugersee','Lage']],sections:[['Geschichte','Die Villa gehört zur historischen Villenlandschaft am Zugersee. Ihre Entstehung steht im Zusammenhang mit der Entwicklung von Cham im 19. Jahrhundert.'],['Architektur und Nutzung','Das Gebäude prägt das Ortsbild und bildet mit dem angrenzenden Park ein historisches Ensemble.'],['Umgebung','Der angrenzende Villettepark wird in einem eigenen Eintrag beschrieben.']],link:4},
{title:'Kirche St. Jakob',tag:'Kirche',intro:'Die katholische Pfarrkirche St. Jakob auf dem Kirchbühl gehört zu den markantesten Gebäuden von Cham.',facts:[['1783–1796','Bau der heutigen Kirche'],['1998','Revision der Kirchturmuhr']],sections:[['Geschichte','Die heutige Kirche wurde im späten 18. Jahrhundert erbaut. Ihr Turm ist weithin sichtbar und prägt das Ortsbild.'],['Kirchturmuhr','1998 wurde die Kirchturmuhr revidiert.'],['Beleuchtung','2025 wurde eine neue Beleuchtung installiert, die die Steinskulpturen und die Kirchenfront gezielt hervorhebt.']]},
{title:'Bahnhof Cham',tag:'Bahnhof',intro:'Der Bahnhof Cham verbindet die Gemeinde seit dem 19. Jahrhundert mit dem regionalen Eisenbahnnetz.',facts:[['19. Jahrhundert','Eisenbahnanschluss'],['1920','Papieribähnli']],sections:[['Geschichte','Die Eisenbahn spielte eine wichtige Rolle bei der wirtschaftlichen und industriellen Entwicklung Chams.'],['Umgebung','In unmittelbarer Bahnhofsnähe befindet sich das historische Gebäude des ehemaligen Restaurants Bahnhof, ursprünglich Restaurant zur Laube.']],link:5},
{title:'Villettepark',tag:'Parkanlage',intro:'Der Villettepark ist eine historische Parkanlage am Zugersee mit Spazierwegen, altem Baumbestand und einer kleinen Insel.',facts:[['1957','Vogelvoliere erbaut'],['2008','Vogelvoliere abgebaut']],sections:[['Geschichte des Parks','Der Park gehört zur historischen Villenlandschaft am Chamer Seeufer und ist als Erholungsraum bekannt.'],['Die kleine Insel','Auf der kleinen Insel befand sich eine Vogelvoliere mit Drahtgitter und Metallkonstruktion. Sie wurde 1957 errichtet und 2008 abgebaut. 1998 war sie noch vorhanden.'],['Villa Villette','Die Villa und der Park bilden ein zusammengehörendes historisches Ensemble.']],link:1},
{title:'Restaurant Bahnhof',tag:'Historische Gastronomie',intro:'Das Gebäude des früheren Restaurants zur Laube, später Restaurant Bahnhof, steht in der Nähe des Bahnhofs Cham.',facts:[['1910','Baujahr'],['1912','Name Restaurant Bahnhof'],['1979','Besitzerwechsel']],sections:[['Bau und Anfänge','1910 liess Baumeister und Architekt Hans Miesch das Restaurant zur Laube im Heimatstil errichten. Bereits 1912 erscheint die Bezeichnung Restaurant Bahnhof.'],['Hotel und Restaurant','Ab 1932 wird das Haus auch als Hotel geführt. 1956 übernahm die Familie von Rohr-Nick den Betrieb. 1979 kamen Theresa und Gerd-Ingo Horstmann-Stieger als neue Besitzer hinzu.'],['Spätere Entwicklung','2016 war das Restaurant geschlossen, während der Hotelbetrieb noch bestand. Nach einem Verkauf 2018 erfolgte eine Wiedereröffnung. 2023 wurde das frühere Restaurant zum Coiffeursalon umgebaut.'],['Gaststube um 1998','In der damaligen Gaststube wurden Reisende und Einheimische bewirtet. Peter Hürlimann war nach den Angaben des Ortsverzeichnisses zeitweise als Kellner tätig.']],link:3}
];
const app=document.getElementById('app');function home(){app.innerHTML='<h1>Cham entdecken</h1><p class="muted">Orte, Geschichte und Informationen aus Cham.</p><div class="grid"><button class="card" onclick="locations()"><b>📍 Standorte</b>Historische Gebäude und Plätze</button><button class="card" onclick="phone()"><b>☎ Telefon</b>Telefonverzeichnis</button><button class="card" onclick="browser()"><b>🌐 Webbrowser</b>Ortsinformationen aufrufen</button><button class="card" onclick="notes()"><b>✎ Notizen</b>Eigene Einträge speichern</button></div>'}
function locations(){app.innerHTML='<button class="back" onclick="home()">← Zurück</button><h1>Standorte</h1><div class="grid">'+places.map((x,i)=>`<button class="card" onclick="detail(${i})"><b>${x.title}</b><small>${x.tag}</small></button>`).join('')+'</div>'}
function detail(i){let x=places[i];app.innerHTML=`<button class="back" onclick="locations()">← Standorte</button><div class="panel"><span class="tag">${x.tag} · Cham</span><h1>${x.title}</h1><p>${x.intro}</p><div class="facts">${x.facts.map(f=>`<div class="fact"><strong>${f[0]}</strong><small>${f[1]}</small></div>`).join('')}</div>${x.sections.map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p>`).join('')}${x.link!==undefined?`<button class="primary" onclick="detail(${x.link})">Mehr zu ${places[x.link].title} →</button>`:''}<p class="source">${disclaimer}</p></div>`}
const numbers={'0417802318':['Daniel Frei','Grüezi, hier ist der Anschluss von Daniel Frei. Ich bin momentan nicht erreichbar.'],'0417804562':['Restaurant Bahnhof','Restaurant Bahnhof, grüezi. Bitte versuchen Sie es später erneut.'],'0417800971':['Unbekannter Anschluss','Guten Tag. Sie haben eine Nachricht erreicht.']};let digits='';function phone(){digits='';app.innerHTML='<button class="back" onclick="home()">← Zurück</button><h1>Telefon</h1><p class="muted">Telefonnummer eingeben</p><div id="display"></div><div class="keys">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')+'</div><div class="nav" style="justify-content:center"><button onclick="digits=digits.slice(0,-1);update()">⌫</button><button class="primary" onclick="call()">☎ Anrufen</button></div><p id="callstatus" class="muted"></p>'}function key(k){digits+=k;update()}function update(){document.getElementById('display').textContent=digits}function call(){let x=numbers[digits.replace(/\D/g,'')];let el=document.getElementById('callstatus');if(!x){el.textContent='Anschluss nicht verfügbar.';return}el.textContent='Verbunden mit '+x[0];speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x[1]);u.lang='de-CH';speechSynthesis.speak(u)}
function browser(){app.innerHTML='<button class="back" onclick="home()">← Zurück</button><h1>Webbrowser</h1><p>Adresse im Ortsverzeichnis eingeben</p><input id="url" placeholder="z. B. cham-net.ch/bahnhof"><p><button class="primary" onclick="goUrl()">Öffnen</button></p><p class="muted">Beispiel: cham-net.ch/villettepark</p>'}function goUrl(){let v=document.getElementById('url').value.toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'');let names=['hirsgarten','villette','kirche','bahnhof','villettepark','restaurant-bahnhof'];let i=names.indexOf(v.replace('cham-net.ch/',''));if(i>=0&&v.startsWith('cham-net.ch/'))detail(i);else document.getElementById('url').insertAdjacentHTML('afterend','<p>Seite nicht gefunden.</p>')}
function saveNotes(){localStorage.setItem('cham_notes',document.getElementById('note').value)}function notes(){app.innerHTML='<button class="back" onclick="home()">← Zurück</button><h1>Notizen</h1><p class="muted">Notizen werden nur auf diesem Gerät gespeichert.</p><textarea id="note"></textarea><p><button class="primary" onclick="saveNotes()">Speichern</button></p>';document.getElementById('note').value=localStorage.getItem('cham_notes')||''}home();
</script></body></html>
